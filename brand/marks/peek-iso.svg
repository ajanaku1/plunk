<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Plunk — Peek, 3D box</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1526"/><stop offset="1" stop-color="#0B0910"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#9B6BFF" stop-opacity="0.3"/><stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2EE89C"/><stop offset="1" stop-color="#1BB97A"/>
    </linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FC784"/><stop offset="1" stop-color="#128F5D"/>
    </linearGradient>
    <linearGradient id="lidTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFFCB"/><stop offset="1" stop-color="#3BEFA6"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040307"/><stop offset="1" stop-color="#1A1426"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#DCCBFF"/><stop offset="0.45" stop-color="#9B6BFF"/><stop offset="1" stop-color="#6A3FD6"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9B6BFF" stop-opacity="0.75"/><stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="10" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lidShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="256" height="256" rx="58"/></clipPath>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect width="256" height="256" fill="url(#halo)"/>
    <ellipse cx="128" cy="226" rx="84" ry="12" fill="#000" opacity="0.5"/>
  </g>

  <!-- box: top opening, two faces -->
  <g filter="url(#drop)">
    <polygon points="56,124 128,88 200,124 128,160" fill="url(#hole)"/>
    <polygon points="56,124 128,160 128,236 56,200" fill="url(#faceL)"/>
    <polygon points="128,160 200,124 200,200 128,236" fill="url(#faceR)"/>
  </g>
  <!-- rim light on the front edges -->
  <polyline points="56,124 128,160 200,124" fill="none" stroke="#9CFFD9" stroke-width="2.5" stroke-linejoin="round" opacity="0.8"/>
  <!-- eyes peeking out of the opening -->
  <circle cx="110" cy="140" r="20" fill="url(#eyeGlow)"/>
  <circle cx="146" cy="140" r="20" fill="url(#eyeGlow)"/>
  <circle cx="110" cy="140" r="8.5" fill="url(#eye)"/>
  <circle cx="146" cy="140" r="8.5" fill="url(#eye)"/>
  <circle cx="107" cy="137" r="2.6" fill="#FFF" opacity="0.9"/>
  <circle cx="143" cy="137" r="2.6" fill="#FFF" opacity="0.9"/>

  <!-- lid, lifted straight up -->
  <g filter="url(#lidShadow)">
    <polygon points="52,86 128,124 128,134 52,96" fill="#1BB97A"/>
    <polygon points="128,124 204,86 204,96 128,134" fill="#128F5D"/>
    <polygon points="52,86 128,48 204,86 128,124" fill="url(#lidTop)"/>
  </g>
  <polyline points="70,86 128,57 186,86" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
</svg>
