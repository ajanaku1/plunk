<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Plunk — Peek, light tile</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE7F7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FF2A8"/><stop offset="1" stop-color="#17B977"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8AFFD2"/><stop offset="1" stop-color="#2EE89C"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0B14"/><stop offset="1" stop-color="#2A2240"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#DCCBFF"/><stop offset="0.45" stop-color="#9B6BFF"/><stop offset="1" stop-color="#6A3FD6"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9B6BFF" stop-opacity="0.6"/><stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="10" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="255" height="255" rx="57.5" fill="none" stroke="#D8D0EA"/>

  <g filter="url(#shadow)">
    <rect x="52" y="112" width="152" height="96" rx="20" fill="url(#body)"/>
  </g>
  <rect x="52" y="112" width="152" height="10" rx="5" fill="#119A64" opacity="0.9"/>
  <rect x="64" y="126" width="128" height="6" rx="3" fill="#FFFFFF" opacity="0.28"/>

  <rect x="62" y="86" width="132" height="34" rx="6" fill="url(#slot)"/>
  <circle cx="102" cy="102" r="22" fill="url(#eyeGlow)"/>
  <circle cx="154" cy="102" r="22" fill="url(#eyeGlow)"/>
  <circle cx="102" cy="102" r="10" fill="url(#eye)"/>
  <circle cx="154" cy="102" r="10" fill="url(#eye)"/>
  <circle cx="98.5" cy="98" r="3" fill="#FFF" opacity="0.9"/>
  <circle cx="150.5" cy="98" r="3" fill="#FFF" opacity="0.9"/>

  <g filter="url(#soft)">
    <rect x="40" y="62" width="176" height="26" rx="11" fill="#17B977"/>
    <rect x="40" y="56" width="176" height="24" rx="11" fill="url(#lid)"/>
  </g>
  <rect x="54" y="61" width="90" height="5" rx="2.5" fill="#FFFFFF" opacity="0.65"/>
  <rect x="62" y="86" width="132" height="8" fill="#000" opacity="0.45"/>
</svg>
