[workspace]
resolver = "2"
members = ["contracts/math", "contracts/launchpad", "contracts/coin", "contracts/integration", "contracts/publisher", "stub", "hello", "tiny"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
plunk-math = { path = "contracts/math" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
